<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographs | DESIGN BY © CHOOPCHEN Ltd.</title>
    <!-- ===== 添加网站图标 ===== -->
    <link rel="icon" type="image/png" href="./images/头像1.png">
    <link rel="stylesheet" href="cursor-style.css">
    <style>
        /* ===== 添加本地字体声明 ===== */
        @font-face {
            font-family: 'MyMenuFont';
            src: url('./fonts/Verdana.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        * { 
            margin:0; padding:0; box-sizing:border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        body { 
            font-family: "MyMenuFont", "PingFang SC", "Microsoft YaHei", sans-serif; 
            color:#000; 
            line-height:1;
            letter-spacing:0.4; 
            overflow-x:hidden; 
            background:#fff;
            position: relative;
        }
        .carousel-bg { 
            position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1; 
            background:#fff;
        }
        /* 导航栏 全站统一自适应参数 */
        nav{
            position:absolute;
            top: clamp(6px, 1.2vh, 12px); 
            left: clamp(6px, 1.2vh, 12px); 
            z-index:999; 
            display:flex; 
            flex-direction:column; 
            gap: clamp(2px, 0.4vh, 4px);
            font-family: 'MyMenuFont', Verdana, sans-serif;
        }
        .logo{
            font-size: clamp(7px, 1.4vh, 18px);
            font-weight: 500; 
            color:#000;
            line-height:0.8; 
            transition:0.3s;
            margin-bottom: 0;
        }
        .menu a, .menu span {
            display:inline-block; 
            text-decoration:none; 
            color:#000;
            font-size: clamp(7px, 1.4vh, 18px);
            font-weight: 500; 
            line-height:0.8; 
            transition: all 0.4s cubic-bezier(0.19,1,0.22,1);
        }
        .menu a:hover{
            transform: translateX(clamp(2px, 0.4vh, 4px)); 
            opacity:0.7;
        }
        .link-group { 
            display:flex;
            align-items:center;
            gap: clamp(1px, 0.2vh, 2px);
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: clamp(1px, 0.2vh, 2px);
        }
        .section{
            max-width:1400px; 
            margin:0 auto; 
            padding: clamp(80px, 12vh, 120px) clamp(12px, 1.2vh, 20px) 40px; 
            position:relative; 
            z-index:1;
        }
        .title{
            text-align:center; 
            font-size: clamp(7px, 1.4vh, 18px);
            font-weight: 500;
            margin-bottom: clamp(40px, 5vh, 60px); 
            color:#000;
            letter-spacing:0.4;
            line-height:1;
        }
        /* ===== 1-2列随机错落网格布局（带间距） ===== */
        .grid{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            align-items: start;
        }
        .item{
            width:100%;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.9s cubic-bezier(0.19,1,0.22,1), transform 0.9s cubic-bezier(0.19,1,0.22,1);
        }
        .item.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .item img{
            width:100%; 
            height:auto; 
            border-radius:0;
            transition: transform 0.4s cubic-bezier(0.19,1,0.22,1), opacity 0.4s ease;
            display: block;
            background: #f5f5f5;
        }
        .item img:hover{
            transform:scale(1.02); 
            opacity:0.92;
        }
        .item-caption {
            padding: 12px 4px 4px;
            background: #fff;
        }
        .item h3{
            font-size: clamp(7px, 1.4vh, 18px); 
            font-weight: 500; 
            color:#000;
            margin: 0;
        }
        .item p{
            font-size: clamp(7px, 1.4vh, 18px); 
            color:#666; 
            margin-top:2px;
            font-weight: 500;
        }
        /* ===== 尺寸类（由 JS 动态添加） ===== */
        .item.span-2col { grid-column: span 2; }
        /* ===== 移动端适配 ===== */
        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .item.span-2col { grid-column: span 1; }
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .section {
                padding: clamp(80px, 12vh, 100px) 16px 40px;
            }
            .item.span-2col { grid-column: span 1; }
        }
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .item.span-2col { grid-column: span 1; }
        }
    </style>
</head>
<body>
<div class="cursor"></div><div class="cursor-trail"></div>
<script src="cursor-script.js"></script>
<nav>
    <div class="logo">DESIGN BY © CHOOPCHEN Ltd.</div>
    <div class="menu">
        <a href="index.html">CC__Home</a>
        <div class="link-group">
            <a href="works.html">CC__Works</a><span>__</span><a href="photographs.html">Photographs</a>
        </div>
        <a href="about.html">CC__Information</a>
        <a href="contact.html">CC__Contact</a>
    </nav>
<section class="section">
    <h2 class="title">Photographs</h2>
    <div class="grid" id="photoGrid">
        <!-- 由 JavaScript 动态生成 50 张图片 -->
    </div>
</section>
<script>
// ---------- 生成 50 张图片随机1-2列交错排版 ----------
const photoGrid = document.getElementById('photoGrid');
const totalImages = 50; // 已修改为50张
// 清空占位
photoGrid.innerHTML = '';
// 随机打乱数组
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}
// 生成尺寸配置：1列 或 2列
const sizeConfigs = [];
for (let i = 0; i < totalImages; i++) {
    const isWide = Math.random() < 0.30; // 30% 概率占2列
    sizeConfigs.push({ colSpan: isWide ? 2 : 1 });
}
// 打乱顺序
shuffleArray(sizeConfigs);
// 调整避免连续太多单列：连续3个1列，把第3个改成2列
for (let i = 2; i < sizeConfigs.length; i++) {
    if (sizeConfigs[i-2].colSpan === 1 && 
        sizeConfigs[i-1].colSpan === 1 && 
        sizeConfigs[i].colSpan === 1) {
        sizeConfigs[i].colSpan = 2;
        i += 2;
    }
}
// 避免连续太多2列：连续2个2列，把第2个改成1列
for (let i = 1; i < sizeConfigs.length - 1; i++) {
    if (sizeConfigs[i-1].colSpan === 2 && sizeConfigs[i].colSpan === 2) {
        sizeConfigs[i].colSpan = 1;
        i += 1;
    }
}
// 循环生成1~50图片项
for (let i = 1; i <= totalImages; i++) {
    const item = document.createElement('div');
    item.className = 'item';
    
    // 应用列跨度
    const config = sizeConfigs[i - 1];
    if (config.colSpan === 2) {
        item.classList.add('span-2col');
    }
    // 图片路径 ./images2/文件X.jpg 1~50
    const img = document.createElement('img');
    img.src = `./images2/文件${i}.jpg`;
    img.alt = `Photo ${String(i).padStart(2, '0')}`;
    img.loading = 'lazy';
    // 标题+描述容器
    const caption = document.createElement('div');
    caption.className = 'item-caption';
    
    const h3 = document.createElement('h3');
    h3.textContent = `PHOTO ${String(i).padStart(2, '0')}`;
    const p = document.createElement('p');
    p.textContent = 'Photography Series';
    caption.appendChild(h3);
    caption.appendChild(p);
    item.appendChild(img);
    item.appendChild(caption);
    photoGrid.appendChild(item);
}
// ---------- 滚动触发动画 ----------
const items = document.querySelectorAll('.item');
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
        }
    });
}, { 
    threshold: 0.05,
    rootMargin: '0px 0px -80px 0px'
});
items.forEach(item => observer.observe(item));
</script>
</body>
</html>
