<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC__Home</title>
    <link rel="icon" type="image/png" href="./images/头像1.png">
    <link rel="stylesheet" href="cursor-style.css">
    <style>
        @font-face {
            font-family: 'MyMenuFont';
            src: url('./fonts/Verdana.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        body {
            font-family: "MyMenuFont", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #e0e0e0;
            line-height: 1;
            letter-spacing: 0.4px;
            font-smooth: always;
            background: #000;
            overflow-y: auto;
            min-height: 100vh;
            padding-bottom: 30vh;
            scroll-behavior: smooth;
        }
        /* 背景容器 */
        .carousel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: #000;
        }
        .carousel-bg img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 1.2s ease-in-out;
            opacity: 0;
        }
        .carousel-bg img.active {
            opacity: 1;
        }
        /* 导航栏边距跟随窗口高度缩放 */
        nav {
            position: relative;
            top: auto;
            left: auto;
            margin-top: clamp(6px, 1.2vh, 12px);
            margin-left: clamp(6px, 1.2vh, 12px);
            display: flex;
            flex-direction: column;
            gap: clamp(2px, 0.4vh, 4px);
            transition: color 0.3s ease;
            font-family: 'MyMenuFont', Verdana, sans-serif;
            z-index: 999;
        }
        nav * {
            color: inherit;
        }
        nav a,
        nav a:link,
        nav a:visited,
        nav a:hover,
        nav a:active {
            color: inherit !important;
        }
        /* 字号上限提升至18px，vh系数加大，窗口拉高文字放大更明显 */
        .logo {
            font-size: clamp(7px, 1.4vh, 18px);
            font-weight: 500;
            line-height: 0.8;
        }
        .menu a,
        .menu span {
            display: inline-block;
            text-decoration: none;
            font-size: clamp(7px, 1.4vh, 18px);
            font-weight: 500;
            line-height: 0.8;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .menu a:hover {
            transform: translateX(clamp(2px, 0.4vh, 4px));
            opacity: 0.7;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: clamp(1px, 0.2vh, 2px);
        }
        .link-group {
            display: flex;
            align-items: center;
            gap: clamp(1px, 0.2vh, 2px);
        }
        nav.menu-light {
            color: #000;
        }
        nav.menu-dark {
            color: #fff;
        }
        /* 加载指示器跟随高度缩放 */
        #page-loader {
            position: fixed;
            bottom: clamp(15px, 2.5vh, 30px);
            left: clamp(15px, 2.5vh, 30px);
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            visibility: visible;
        }
        #page-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loader-spinner {
            width: clamp(14px, 2.3vh, 28px);
            height: clamp(14px, 2.3vh, 28px);
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        html {
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <!-- 自定义光标 -->
    <div class="cursor"></div>
    <div class="cursor-trail"></div>
    <script src="cursor-script.js"></script>
    <!-- 加载指示器 -->
    <div id="page-loader">
        <div class="loader-spinner"></div>
    </div>
    <!-- 背景轮播（固定） -->
    <div class="carousel-bg" id="carouselBg">
        <img id="bgSlider" src="" alt="background">
    </div>
    <!-- 菜单（滚动） -->
    <nav id="mainNav">
        <div class="logo">DESIGN BY © CHOOPCHEN Ltd.</div>
        <div class="menu">
            <a href="index.html">CC__Home</a>
            <div class="link-group">
                <a href="works.html">CC__Works</a><span>__</span><a href="photographs.html">Photographs</a>
            </div>
            <a href="about.html">CC__Information</a>
            <a href="contact.html">CC__Contact</a>
        </nav>
    <script>
        (function() {
            // 循环改为1~50，新增两张图片文件49、文件50
            function generateImageList() {
                const list = [];
                for (let i = 1; i <= 50; i++) {
                    list.push(`./images2/文件${i}.jpg`);
                }
                for (let i = list.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [list[i], list[j]] = [list[j], list[i]];
                }
                return list;
            }
            const imageList = generateImageList();
            const bgImg = document.getElementById('bgSlider');
            const nav = document.getElementById('mainNav');
            let currentIndex = 0;
            let isTransitioning = false;
            function getImageBrightness(img) {
                const canvas = document.createElement('canvas');
                const scale = 50;
                canvas.width = scale;
                canvas.height = scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, scale, scale);
                const imageData = ctx.getImageData(0, 0, scale, scale);
                const data = imageData.data;
                let sum = 0;
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    sum += (r + g) / 3;
                }
                return sum / (data.length / 4);
            }
            function updateMenuColor(brightness) {
                if (brightness > 128) {
                    nav.classList.remove('menu-dark');
                    nav.classList.add('menu-light');
                } else {
                    nav.classList.remove('menu-light');
                    nav.classList.add('menu-dark');
                }
            }
            function nextImage() {
                if (isTransitioning) return;
                isTransitioning = true;
                bgImg.classList.remove('active');
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % imageList.length;
                    bgImg.src = imageList[currentIndex];
                    bgImg.classList.add('active');
                    bgImg.onload = function() {
                        const brightness = getImageBrightness(bgImg);
                        updateMenuColor(brightness);
                    };
                    if (bgImg.complete) {
                        bgImg.onload && bgImg.onload();
                    }
                    isTransitioning = false;
                }, 1200);
            }
            // 初始化第一张图片，变量无错误
            bgImg.src = imageList[0];
            bgImg.onload = function() {
                const brightness = getImageBrightness(bgImg);
                updateMenuColor(brightness);
                bgImg.classList.add('active');
            };
            if (bgImg.complete) {
                bgImg.onload && bgImg.onload();
            }
            setInterval(nextImage, 5000);
        })();
        // 加载完成后隐藏指示器
        window.addEventListener('load', function() {
            const loader = document.getElementById('page-loader');
            if (loader) {
                loader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
