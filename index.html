<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC__Home</title>
    <!-- 网站图标 -->
    <link rel="icon" type="image/png" href="./images/头像1.png">
    <link rel="stylesheet" href="cursor-style.css">
    <style>
        /* ===== 更换为 Verdana 字体 ===== */
        @font-face {
            font-family: 'MyMenuFont';
            src: url('./fonts/Verdana.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin:0; padding:0; box-sizing:border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        body {
            font-family: "MyMenuFont", "PingFang SC", "Microsoft YaHei", sans-serif;
            color:#e0e0e0;
            line-height:1;
            letter-spacing:0.3px;
            overflow:hidden;
            font-smooth: always;
            background:#000;
        }
        .carousel-bg {
            position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1;
            background:#000;
        }
        .carousel-bg img {
            position:absolute; 
            width:100%; 
            height:100%; 
            object-fit:cover; 
            transition: opacity 1.2s ease-in-out;
            opacity:0;
        }
        .carousel-bg img.active {
            opacity:1;
        }

        /* ----- 菜单栏基础样式（已应用 Verdana） ----- */
        nav{
            position:fixed; 
            top:12px; 
            left:12px; 
            z-index:999; 
            display:flex; 
            flex-direction:column; 
            gap:4px; 
            transition: color 0.3s ease;
            font-family: 'MyMenuFont', Verdana, sans-serif;
        }
        /* 所有文字继承父级颜色，且链接不显示默认蓝色 */
        nav * {
            color: inherit;
        }
        /* 特别针对链接的各个状态，强制继承 */
        nav a,
        nav a:link,
        nav a:visited,
        nav a:hover,
        nav a:active {
            color: inherit !important; 
        }
        .logo{
            font-size:10px; 
            font-weight:400; 
            line-height:0.8; 
        }
        .menu a, .menu span {
            display:inline-block; 
            text-decoration:none; 
            font-size:10px; 
            font-weight:400; 
            line-height:0.8; 
            transition: all 0.4s cubic-bezier(0.19,1,0.22,1);
        }
        .menu a:hover{
            transform: translateX(4px); 
            opacity:0.7;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .link-group {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* ----- 明暗模式：通过 nav 自身的 color 控制所有文字 ----- */
        nav.menu-light {
            color: #000;
        }
        nav.menu-dark {
            color: #fff;
        }
    </style>
</head>
<body>
<div class="cursor"></div><div class="cursor-trail"></div>
<script src="cursor-script.js"></script>

<!-- 背景轮播容器 -->
<div class="carousel-bg" id="carouselBg">
    <img id="bgSlider" src="" alt="background">
</div>

<nav id="mainNav">
    <div class="logo">DESIGN BY © CHOOPCHEN Ltd.</div>
    <div class="menu">
        <a href="index.html">CC__Home</a>
        <div class="link-group">
            <a href="works.html">CC__Works</a><span>__</span><a href="photographs.html">Photographs</a>
        </div>
        <a href="about.html">CC__Information</a>
        <a href="contact.html">CC__Contact</a>
    </div>
</nav>

<script>
(function() {
    // ---------- 所有本地图片路径 ----------
    const imageList = [
        "./images/作品集_1-1.png",
        "./images/作品集_1-2.png",
        "./images/作品集_1-3.png",
        "./images/作品集_1-4.png",
        "./images/作品集_1-5.png",
        "./images/作品集_2-1-1.png",
        "./images/作品集_2-1.png",
        "./images/作品集_2-2.png",
        "./images/作品集_2-3.png",
        "./images/作品集_2-4.png",
        "./images/作品集_3-1.png",
        "./images/作品集_3-2.png",
        "./images/作品集_3-3.png",
        "./images/作品集_3-4.png",
        "./images/作品集_3-5.png",
        "./images/作品集_4-1.png",
        "./images/作品集_4-2.png",
        "./images/作品集_4-3.png",
        "./images/作品集_4-4.png",
        "./images/作品集_4-5.png",
        "./images/作品集_5-1.png",
        "./images/作品集_5-2.png",
        "./images/作品集_6-1.png",
        "./images/作品集_6-2.png",
        "./images/作品集_6-3.png",
        "./images/作品集_6-4.png",
        "./images/作品集_7-1.png",
        "./images/作品集_7-2.png",
        "./images/作品集_7-3.png",
        "./images/作品集_7-4.png",
        "./images/作品集_7-5.png",
        "./images/作品集_8-1.png",
        "./images/作品集_8-2.png",
        "./images/作品集_8-3.png",
        "./images/作品集_8-4.png",
        "./images/作品集_8-5.png",
        "./images/作品集_8-6.png",
        "./images/作品集_8-7.png",
        "./images/作品集_8-8.png",
        "./images/作品集_9.png",
        "./images/作品集_10.png",
        "./images/作品集_11-1.png",
        "./images/作品集_11-2.png",
        "./images/作品集_14-1.png",
        "./images/作品集_14-2.png",
        "./images/作品集_14-3.png",
        "./images/作品集_14-5.png",
        "./images/作品集_14-6.png",
        "./images/作品集_14-7.png",
        "./images/作品集_16-1.png",
        "./images/作品集_16-2.png",
        "./images/作品集_16-4.png",
        "./images/作品集_16-5.png",
        "./images/作品集_16-6.png",
        "./images/作品集_16-7.png",
        "./images/作品集_18-1.png",
        "./images/作品集_18-2.png",
        "./images/作品集_18-3.png",
        "./images/作品集_18-4.png"
    ];

    const bgImg = document.getElementById('bgSlider');
    const nav = document.getElementById('mainNav');
    let currentIndex = 0;
    let isTransitioning = false;

    // ---------- 计算图片平均亮度 ----------
    function getImageBrightness(img) {
        const canvas = document.createElement('canvas');
        const scale = 50;
        canvas.width = scale;
        canvas.height = scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, scale, scale);
        const imageData = ctx.getImageData(0, 0, scale, scale);
        const data = imageData.data;
        let sum = 0;
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            sum += (r + g + b) / 3;
        }
        return sum / (data.length / 4);
    }

    // ---------- 根据亮度更新菜单颜色 ----------
    function updateMenuColor(brightness) {
        if (brightness > 128) {
            nav.classList.remove('menu-dark');
            nav.classList.add('menu-light');
        } else {
            nav.classList.remove('menu-light');
            nav.classList.add('menu-dark');
        }
    }

    // ---------- 切换背景图 ----------
    function nextImage() {
        if (isTransitioning) return;
        isTransitioning = true;

        bgImg.classList.remove('active');

        setTimeout(() => {
            currentIndex = (currentIndex + 1) % imageList.length;
            bgImg.src = imageList[currentIndex];
            bgImg.classList.add('active');

            bgImg.onload = function() {
                const brightness = getImageBrightness(bgImg);
                updateMenuColor(brightness);
            };
            if (bgImg.complete) {
                bgImg.onload && bgImg.onload();
            }

            isTransitioning = false;
        }, 1200);
    }

    // ---------- 初始化 ----------
    bgImg.src = imageList[0];
    bgImg.onload = function() {
        const brightness = getImageBrightness(bgImg);
        updateMenuColor(brightness);
        bgImg.classList.add('active');
    };
    if (bgImg.complete) {
        bgImg.onload && bgImg.onload();
    }

    // ===== 轮播间隔从 4000ms（4秒）改为 5000ms（5秒） =====
    setInterval(nextImage, 5000);
})();
</script>
</body>
</html>
